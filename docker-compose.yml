services:
  db:
    image: mysql:8.4
    container_name: huellero-db
    environment:
      MYSQL_DATABASE: ${DB_NAME:-attendance}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: huellero-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: huellero-backend
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: 127.0.0.1
      REDIS_URL: redis://127.0.0.1:6379/0
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    container_name: huellero-worker
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: 127.0.0.1
      REDIS_URL: redis://127.0.0.1:6379/0
    network_mode: host
    command: celery -A src.infrastructure.queue.celery_app:celery_app worker --loglevel=INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: ./backend
    container_name: huellero-beat
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://127.0.0.1:6379/0
    network_mode: host
    command: celery -A src.infrastructure.queue.celery_app:celery_app beat --loglevel=INFO
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped


  frontend:
    build: ./frontend
    container_name: huellero-frontend
    env_file:
      - path: .env
        required: false
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
