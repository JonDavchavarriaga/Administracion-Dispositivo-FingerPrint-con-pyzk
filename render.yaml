services:
  - type: web
    name: biometric-attendance-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: MOCK_MODE
        value: "True"
      - key: ENABLE_LEGACY_SCHEDULER
        value: "False"
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
